name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor and plugins
        working-directory: masrofaty-android
        run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/app-launcher @capacitor/filesystem @capacitor/share @capacitor/app @capacitor/status-bar

      - name: Check project files
        working-directory: masrofaty-android
        run: |
          ls -la
          test -f capacitor.config.json && cat capacitor.config.json
          test -d www && ls www

      - name: Add Android project (first time only)
        working-directory: masrofaty-android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Copy web files into the Android project
        working-directory: masrofaty-android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: masrofaty-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masrofaty-apk
          path: masrofaty-android/android/app/build/outputs/apk/debug/app-debug.apk
