name: "Build My Cash: Tracker APK"

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor and plugins
        working-directory: masrofaty-android
        run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/app-launcher @capacitor/filesystem @capacitor/share @capacitor/app @capacitor/status-bar @codetrix-studio/capacitor-google-auth

      - name: Check project files
        working-directory: masrofaty-android
        run: |
          ls -la
          test -f capacitor.config.json && cat capacitor.config.json
          test -d www && ls www

      - name: Add Android project (first time only)
        working-directory: masrofaty-android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Copy web files into the Android project
        working-directory: masrofaty-android
        run: npx cap sync android

      - name: Force English app name on the phone
        working-directory: masrofaty-android/android
        run: |
          F=app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">My Cash: Tracker</string>#' "$F"
          sed -i 's#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">My Cash: Tracker</string>#' "$F"
          grep -n "app_name" "$F"

      - name: Use fixed signing key (keeps Google sign-in working)
        working-directory: masrofaty-android
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: masrofaty-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masrofaty-apk
          path: masrofaty-android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Masrofaty build ${{ github.run_number }}
          body: APK built automatically from the latest commit.
          files: masrofaty-android/android/app/build/outputs/apk/debug/app-debug.apk
