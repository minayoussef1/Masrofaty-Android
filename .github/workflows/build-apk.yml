name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo root for debugging
        run: |
          echo "Working directory:"
          pwd
          echo "Repository contents:"
          ls -la

      - name: Ensure masrofaty-android exists
        run: |
          if [ ! -d masrofaty-android ]; then
            echo "ERROR: masrofaty-android directory not found in repo root. Current contents:"
            ls -la
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor and plugins
        run: |
          cd masrofaty-android
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/app-launcher @capacitor/filesystem @capacitor/share @capacitor/app @capacitor/status-bar

      - name: Check project files
        run: |
          cd masrofaty-android
          ls -la
          test -f capacitor.config.json && cat capacitor.config.json
          test -d www && ls www

      - name: Add Android project (first time only)
        run: |
          cd masrofaty-android
          if [ ! -d android ]; then npx cap add android; fi

      - name: Copy web files into the Android project
        run: |
          cd masrofaty-android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd masrofaty-android/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masrofaty-apk
          path: masrofaty-android/android/app/build/outputs/apk/debug/app-debug.apk
