<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>My Cash: Tracker</title>
<style>
:root{--bg1:#0b1226;--bg2:#13234a;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--text:#eef2ff;--mut:#9aa8cc;--page:radial-gradient(120% 70% at 80% 0%,#27407f 0%,transparent 60%),radial-gradient(90% 60% at 0% 100%,#3a2a7a 0%,transparent 55%),linear-gradient(180deg,#13234a,#0b1226);--nav:rgba(15,25,56,.82);--hole:#14214a;--blur:18px;--inp:rgba(255,255,255,.06);--on:#fff;--gsheen:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 50%,rgba(255,255,255,.07));--gshadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 32px rgba(0,0,0,.28);--bf:blur(18px) saturate(1.7);--acc:#4f7cff;--acc2:#7c5cff;--inc:#22c55e;--exp:#ef4444;--loan:#8b5cf6;--rep:#06b6d4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--page);background-attachment:fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 100px)}
.app{max-width:480px;margin:0 auto}
.screen{display:none}.screen.on{display:block;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.g{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf);background-image:var(--gsheen);box-shadow:var(--gshadow);padding:14px;margin-bottom:12px}
h2{font-size:20px;margin:6px 4px 14px}
.hi{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 14px}
.hi small{color:var(--mut)}.hi b{font-size:20px;display:block}
.bal{background:linear-gradient(135deg,rgba(var(--accrgb),.35),rgba(124,92,255,.2));text-align:start}
.bal small{color:var(--mut)}.bal .n{font-size:38px;font-weight:700;margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.grid3 .g,.grid2 .g{margin:0;padding:12px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st small{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}.st b{font-size:17px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.loan{color:var(--loan)}.rep{color:var(--rep)}
.tip{display:flex;gap:10px;align-items:center;font-size:14px;background:rgba(var(--accrgb),.15)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:15px}.row .m small{color:var(--mut);font-size:12px}
.row .a{font-weight:700;direction:ltr;white-space:nowrap}
.del{background:none;border:0;color:var(--mut);font-size:16px;padding:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--text);font-size:14px;font-family:inherit}
.chip.on{background:var(--acc);border-color:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.cat{padding:14px 6px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--text);text-align:center;font-size:13px;font-family:inherit}
.cat span{display:block;font-size:22px;margin-bottom:4px}
.cat.on{border-color:var(--acc);background:rgba(var(--accrgb),.25)}
label{display:block;color:var(--mut);font-size:13px;margin:10px 4px 6px}
input,textarea{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--text);outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:16px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font:inherit;font-size:17px;font-weight:600}
.btn.s{background:var(--glass);border:1px solid var(--line);margin-top:8px;font-size:15px;padding:12px}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mn button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--text);font-size:18px}
.donut{width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center}
.donut div{width:98px;height:98px;border-radius:50%;background:var(--hole);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mut)}
.donut b{display:block;font-size:19px;color:var(--text)}
.lg{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:8px}
.bars{display:flex;align-items:flex-end;gap:14px;height:110px;justify-content:space-around}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bars .c{display:flex;align-items:flex-end;gap:4px;height:90px}
.bars .c span{width:14px;border-radius:5px 5px 0 0;min-height:2px}
.bars small{color:var(--mut);font-size:11px}
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:9}
.nav>div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;background:var(--nav);border:1px solid var(--line);border-radius:26px;padding:8px 6px;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf);position:relative;box-shadow:var(--gshadow)}
.nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px}
.nav button span{font-size:20px}.nav button.on{color:var(--on)}
.nav .fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:30px;margin-top:-30px;box-shadow:0 8px 24px rgba(var(--accrgb),.5);justify-content:center;padding:0}
.empty{text-align:center;color:var(--mut);padding:24px 0;font-size:14px}
.sec{color:var(--mut);font-size:13px;margin:12px 4px 6px}

:root[data-theme="dark"]{--gsheen:none;--gshadow:0 4px 18px rgba(0,0,0,.35);--bf:none;--page:#0a0d14;--glass:#161b26;--line:#252c3d;--nav:#121722;--hole:#161b26;--blur:0px;--inp:#0f131c;--mut:#8b95ad}
:root[data-theme="light"]{--gsheen:none;--gshadow:0 2px 10px rgba(30,40,80,.06);--bf:none;--page:#f1f4fa;--glass:#ffffff;--line:#e0e5f0;--text:#1b2233;--mut:#6b7488;--nav:rgba(255,255,255,.94);--hole:#ffffff;--blur:0px;--inp:#f3f5fa;--on:var(--acc)}
:root[data-theme="light"] .g{box-shadow:0 2px 10px rgba(30,40,80,.06)}
:root[data-theme="light"] .bal{background:linear-gradient(135deg,rgba(var(--accrgb),.18),rgba(124,92,255,.1))}
.chip.on{color:#fff}
html{scroll-behavior:smooth;overscroll-behavior-y:none}
button,.chip,.cat{touch-action:manipulation;transition:transform .12s ease,background .2s,border-color .2s}
button:active{transform:scale(.95)}
.g,input,textarea{transition:background .25s,border-color .25s,color .25s}
.bars .c span{transition:height .4s ease}
html.lite{--blur:0px}
html.lite *,html.lite *::before{transition:none!important;animation:none!important}
html.lite{scroll-behavior:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{--panel:#16244e}
:root[data-theme="dark"]{--panel:#161b26}
:root[data-theme="light"]{--panel:#fff}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;animation:up .28s ease}
#sheet h3{margin:4px 0 4px;font-size:20px}#sheet p{margin:0 0 6px;color:var(--mut);font-size:13px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.avatar{width:64px;height:64px;border-radius:50%;margin:6px auto 8px;display:grid;place-items:center;font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.pname{font-size:18px;font-weight:600}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%) translateY(16px);background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
.warn{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);color:#fbbf24;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:8px}
:root[data-theme="light"] .warn{color:#b45309}
.badge{background:rgba(245,158,11,.2);color:#f59e0b;border-radius:8px;padding:1px 7px;font-size:11px}
.badge.r{background:rgba(239,68,68,.2);color:#ef4444}
.tap{cursor:pointer}.tap:active{opacity:.7}
.a small{display:block;font-size:11px;color:var(--mut);font-weight:400}

html.lite{--bf:none;--gsheen:none}
.dbt{color:#f59e0b}
button,.tap{position:relative;overflow:hidden}
button,.chip,.cat{transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s}
button:active{transform:scale(.94);transition-duration:.08s}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,.1) 55%,transparent 70%);transform:scale(0);animation:rip .65s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.nav button{z-index:1}
.nav .fab{box-shadow:0 8px 24px rgba(var(--accrgb),.5),inset 0 2px 3px rgba(255,255,255,.45),inset 0 -3px 8px rgba(0,0,0,.15)}
.drop{position:absolute;z-index:0;border-radius:20px;pointer-events:none;opacity:0;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -6px 12px rgba(120,150,255,.2),0 6px 18px rgba(0,0,0,.2);transition:left .6s cubic-bezier(.34,1.4,.5,1),width .6s cubic-bezier(.34,1.4,.5,1),top .3s,height .3s,opacity .25s,transform .55s cubic-bezier(.34,1.56,.64,1)}
.drop.sq{animation:squish .6s ease}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.14,.82)}70%{transform:scale(.96,1.07)}100%{transform:scale(1)}}
:root[data-theme="light"] .drop{background:rgba(var(--accrgb),.1);border-color:rgba(var(--accrgb),.25);box-shadow:inset 0 1px 1px rgba(255,255,255,.8)}
:root[data-theme="dark"] .drop{background:rgba(255,255,255,.08)}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;display:none;pointer-events:none}
:root[data-theme="glass"] .orbs,:root[data-theme="glasslight"] .orbs{display:block}
html.lite .orbs{display:none!important}
.orbs i{position:absolute;border-radius:50%;animation:float 16s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:320px;height:320px;background:radial-gradient(circle,rgba(var(--accrgb),.5),transparent 70%);top:-80px;right:-80px}
.orbs i:nth-child(2){width:280px;height:280px;background:radial-gradient(circle,rgba(var(--acc2rgb),.45),transparent 70%);bottom:100px;left:-90px;animation-duration:21s}
.orbs i:nth-child(3){width:240px;height:240px;background:radial-gradient(circle,rgba(var(--accrgb),.3),transparent 70%);top:42%;right:-80px;animation-duration:25s}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,60px) scale(1.15)}}
.screen.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.screen.enter>*:nth-child(2){animation-delay:.05s}.screen.enter>*:nth-child(3){animation-delay:.1s}.screen.enter>*:nth-child(4){animation-delay:.15s}.screen.enter>*:nth-child(5){animation-delay:.2s}.screen.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.pbar i{display:block;height:100%;border-radius:99px}
.eye{background:none;border:0;font-size:18px;padding:2px 8px;color:var(--text)}
.wbrk{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}.wbrk span{background:rgba(255,255,255,.2);border-radius:12px;padding:5px 10px;font-size:12.5px;color:#fff}.wbrk b{font-size:12.5px;margin-inline-start:3px}
.wsp{max-width:120px;text-align:center}.sgbtn.on{background:rgba(var(--accrgb),.16);color:var(--acc);border-color:rgba(var(--accrgb),.4)}
.sub2{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.bal .top{display:flex;justify-content:space-between;align-items:center}

.ov{position:fixed;inset:0;z-index:40;display:none;background:var(--page);background-attachment:fixed;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 24px}
.ov.on{display:block}#lock{z-index:50}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;margin-top:24px;direction:ltr}
.pad button{height:72px;border-radius:50%;font-size:26px;border:1px solid var(--line);background:var(--glass);color:var(--text);font-family:inherit}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}.dots i.f{background:var(--acc);border-color:var(--acc)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.ctys{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.cty{padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--text);font:inherit;font-size:14px;text-align:center}
.cty b{display:block;font-size:24px}.cty.on{border-color:var(--acc);background:rgba(var(--accrgb),.25)}
.lnk{color:var(--acc);font-size:13px}
.row input{flex:1;min-width:0}

.nav>div{touch-action:none;-webkit-user-select:none;user-select:none}
.nav button.pv{color:var(--on)}
.drop.drag{transform:scale(1.06,1);transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1);background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,.1));-webkit-backdrop-filter:blur(3px) brightness(1.25) saturate(1.8);backdrop-filter:blur(3px) brightness(1.25) saturate(1.8);box-shadow:inset 0 1px 2px rgba(255,255,255,.7),inset 0 -8px 16px rgba(120,150,255,.3),0 14px 30px rgba(0,0,0,.3)}
html.lite .drop.drag{-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-theme="light"] .drop.drag{background:rgba(var(--accrgb),.16)}

.nav button span{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.nav button.on span{transform:scale(1.12)}
.nav>div.dg button span{transform:none!important}
.nav>div.dg button:not(.fab){transform:translateY(calc((1 - var(--z,1))*16px)) scale(var(--z,1));transition:transform .09s linear}
select{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--text);outline:none}
option{color:#111}
#tour{z-index:45}

:root{--accrgb:79,124,255;--acc2rgb:124,92,255}
:root[data-theme="glasslight"]{--glass:rgba(255,255,255,.5);--line:rgba(255,255,255,.8);--text:#1b2233;--mut:#56617d;--nav:rgba(255,255,255,.55);--hole:#f1f5ff;--inp:rgba(255,255,255,.65);--on:var(--acc);--panel:rgba(255,255,255,.93);--gsheen:linear-gradient(145deg,rgba(255,255,255,.7),rgba(255,255,255,.12) 50%,rgba(255,255,255,.4));--gshadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4),0 8px 28px rgba(60,80,140,.18);--bf:blur(18px) saturate(1.8);--page:linear-gradient(180deg,#eef2ff,#dfe7fb)}
:root[data-theme="glasslight"] .drop{background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.35));border-color:rgba(255,255,255,.95);box-shadow:inset 0 1px 1px #fff,inset 0 -6px 12px rgba(var(--accrgb),.15),0 6px 18px rgba(60,80,140,.2)}
:root[data-theme="glasslight"] .drop.drag{background:rgba(255,255,255,.55)}
:root[data-theme="glasslight"] .warn{color:#b45309}
:root[data-theme="glasslight"] .orbs i{opacity:.7}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 2px 3px rgba(255,255,255,.5),0 2px 6px rgba(0,0,0,.25)}
.sw.on{border-color:var(--text);transform:scale(1.15)}

.btn.s{color:var(--text)}
.nav button .ico{display:block;width:27px;height:27px;font-size:0;line-height:0}
.nav button .ico svg{width:27px;height:27px;display:block}

.nav button.on .ico .f,.nav button.pv .ico .f{display:block}

/* iOS/Android polish */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,.chip,.btn,.cat,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px!important}
:focus-visible{outline:2px solid #4f7cff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ===== Design pass: light-first, calm surfaces, glass only on nav and floating controls ===== */
:root{--radius-card:20px;--shadow-card:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
:root[data-theme="light"]{--page:#f2f5fb;--glass:#ffffff;--line:#e6eaf3;--text:#141b2d;--mut:#6b7590;--inp:#f5f7fb;--panel:#ffffff;--nav:rgba(255,255,255,.72);--hole:#ffffff}
:root[data-theme="dark"]{--page:#0c1120;--glass:#151c2e;--line:#243049;--text:#e7ecf8;--mut:#8d9ab6;--inp:#111829;--panel:#151c2e;--nav:rgba(21,28,46,.7);--hole:#151c2e;--gshadow:none}
body{font-size:16px;line-height:1.5}
h2{font-weight:700}
/* cards: solid surfaces, no blur or sheen */
.g{background:var(--glass)!important;background-image:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card)!important}
:root[data-theme="dark"] .g{box-shadow:none!important}
/* balance card: one calm accent surface */
.bal{background:linear-gradient(135deg,var(--acc),var(--acc2))!important;border-color:transparent}
.bal small,.bal .n,.bal b{color:#fff!important}
.bal small{opacity:.85}
/* bottom nav: the only glass surface */
.nav>div{background:var(--nav)!important;backdrop-filter:blur(22px) saturate(1.8)!important;-webkit-backdrop-filter:blur(22px) saturate(1.8)!important;border:1px solid var(--line);border-radius:28px;box-shadow:0 8px 28px rgba(16,24,40,.12)!important}
:root[data-theme="dark"] .nav>div{box-shadow:0 8px 28px rgba(0,0,0,.35)!important}
html.lite .nav>div{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--panel)!important}
/* ===== Layout pass v2: iOS-style grouped surfaces, segmented controls, icon tiles ===== */
:root{--seg:rgba(118,118,128,.12);--tint-g:rgba(34,197,94,.14);--tint-r:rgba(239,68,68,.12);--tint-p:rgba(139,92,246,.14);--tint-b:rgba(var(--accrgb),.14)}
:root[data-theme="dark"]{--seg:rgba(120,130,160,.18);--tint-g:rgba(34,197,94,.2);--tint-r:rgba(239,68,68,.2);--tint-p:rgba(139,92,246,.22);--tint-b:rgba(var(--accrgb),.22)}
body{background-color:var(--page)}
h2{font-size:28px;font-weight:800;letter-spacing:-.3px;margin:8px 4px 16px}
.hi{margin:4px 2px 14px}
.hi b{font-size:22px;font-weight:800}
.hi small{font-size:13px}
.av{width:42px;height:42px;border-radius:50%;border:0;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:17px;font-weight:700;font-family:inherit}
/* balance: solid accent card, big number */
.bal{padding:18px 18px 16px;border-radius:24px}
.bal .n{font-size:40px;font-weight:800;letter-spacing:-.5px}
.bal .pbar{background:rgba(255,255,255,.28);height:6px}
.bal .pbar i{background:#fff!important}
/* stat tiles with icon squares */
.grid3 .g,.grid2 .g{border-radius:20px;text-align:start}
.st[data-ic]{position:relative;padding:14px 12px 12px!important;min-height:92px}
.st[data-ic]::before{content:attr(data-glyph);position:absolute;top:12px;inset-inline-end:12px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--tint,var(--tint-b))}
.st[data-ic="inc"]{--tint:var(--tint-g)}.st[data-ic="exp"]{--tint:var(--tint-r)}
.st[data-ic="loan"]{--tint:var(--tint-p)}.st[data-ic="days"],.st[data-ic="avail"]{--tint:var(--tint-b)}
.st[data-ic] small{margin-top:0;padding-inline-end:36px;font-size:12px}
.st[data-ic] b{display:block;margin-top:14px;font-size:18px;font-weight:700}
/* grouped inset lists (settings, plans) */
.g>.sec{font-size:13px;font-weight:600;margin:6px 6px 4px}
.g>.btn.s{background:none!important;border:0!important;border-radius:0;border-top:1px solid var(--line);margin:0!important;padding:15px 6px;text-align:start;font-size:16px;font-weight:500;color:var(--text);display:flex;align-items:center;justify-content:space-between;box-shadow:none}
.g>.btn.s::after{content:"‹";color:var(--mut);font-size:24px;line-height:1;margin-inline-start:8px}
.g>.sec+.btn.s,.g>.sec:first-child+.btn.s{border-top:0}
/* segmented controls */
.tabs{background:var(--seg);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:nowrap}
.tabs .chip{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--mut);box-shadow:none}
.tabs .chip.on{background:var(--glass);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);border:0}
:root[data-theme="dark"] .tabs .chip.on{background:#2a3450}
.tabs .sw{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid transparent;margin:2px}
.tabs .sw.on{border-color:var(--text)}
/* inputs closer to iOS fields */
input,textarea{border-radius:12px;padding:12px 14px;background:var(--inp)}
.btn{border-radius:14px;font-weight:600}
/* group cards */
.g{border-radius:20px;padding:6px 14px}
.g .row{padding:12px 0}
.g .row .ic{border-radius:11px;width:38px;height:38px}
/* bottom nav: floating pill with labels */
.nav>div{border-radius:30px;padding:8px 10px}
.nav button{font-size:11px;font-weight:600}
.nav .fab{width:58px;height:58px;margin-top:-34px;box-shadow:0 10px 26px rgba(var(--accrgb),.45)}
.tabs.wide{overflow-x:auto;scrollbar-width:none}.tabs.wide::-webkit-scrollbar{display:none}.tabs.wide .chip{flex:none;white-space:nowrap;padding:8px 12px}

/* ===== v3: summary donut, settings rows with icon tiles ===== */
.dflex{display:flex;align-items:center;gap:18px;margin-top:8px}
.dflex .donut{flex:none;width:150px;height:150px;margin:0}
.dflex .donut div{width:104px;height:104px}
.dleg{flex:1;min-width:0}
.dleg .lg{padding:9px 0;border-bottom:1px solid var(--line)}
.dleg .lg:last-child{border:0}
.pf{display:flex;align-items:center;gap:14px;padding:16px}
.pf b{display:block;font-size:18px;font-weight:700}
.pf small{color:var(--mut);font-size:13px}
.av.big{width:56px;height:56px;font-size:22px;flex:none}
.g>.btn.s{display:flex;align-items:center;gap:12px;justify-content:flex-start}
.g>.btn.s>span{flex:1;text-align:start}
.g>.btn.s::after{margin-inline-start:auto}
.ti{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:16px;background:var(--tint-b);flex:none}
.pf .av{margin:0;display:grid;place-items:center;line-height:1;padding:0}

/* ===== v4: centered screen titles, daily expense chart, wallets screen ===== */
h2{text-align:center;font-size:18px;font-weight:700;margin:4px 0 14px}
.dbar{display:flex;gap:8px;height:170px;margin-top:6px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--mut);width:44px;text-align:end;padding-bottom:18px;direction:ltr}
.dcols{flex:1;display:flex;align-items:stretch;gap:3px;border-inline-start:1px dashed var(--line)}
.dc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.dc i{display:block;width:62%;border-radius:4px 4px 2px 2px;background:var(--acc);min-height:2px;transition:height .4s ease}
.dc small{font-size:10px;color:var(--mut);height:12px;line-height:12px}
.wtot{text-align:center;padding:18px}
.wtot small{display:block;color:var(--mut);font-size:13px}
.wtot b{font-size:30px;font-weight:800}
.wcard{display:flex;align-items:center;gap:12px;padding:14px}
.wi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--tint-b);flex:none}
.wm{flex:1;min-width:0}
.wm small{display:block;color:var(--mut);font-size:13px}
.wm b{font-size:18px;font-weight:700}
/* ===== v5: settings screen matches the reference ===== */
.pfb{width:100%;display:flex;align-items:center;gap:14px;border:0;color:var(--text);font:inherit;text-align:start;padding:16px;margin-bottom:16px;cursor:pointer}
.pfb .pt{display:block}
.pfb .pt b{display:block;font-size:18px;font-weight:700}
.pfb .pt small{display:block;color:var(--mut);font-size:13px}
.pfb .av{width:56px;height:56px;margin:0;display:grid;place-items:center;flex:none;background:var(--tint-b);color:var(--acc)}
.pfb .av .ico{width:28px;height:28px}
.sgrp{background:var(--glass);border:1px solid var(--line);border-radius:20px;margin:0 0 16px;overflow:hidden;box-shadow:var(--shadow-card)}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;text-align:start;min-height:52px;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow .ico{width:22px;height:22px;color:var(--acc);flex:none}
.srow .sl{flex:1}
.srow em{font-style:normal;color:var(--mut);font-size:15px}
.sch{color:var(--mut);font-size:22px;line-height:1;font-style:normal}
.panel.det{max-height:88vh;overflow-y:auto;text-align:start}
.panel.det h3{text-align:center}
.det .g,.det .sgrp{margin:0 0 12px}
.det .sgrp .srow .ico{width:20px;height:20px}
.det .wrapT{flex-wrap:wrap}
/* ===== v6: reports layout as reference, pure black dark theme ===== */
.rtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.rtop h2{flex:1;margin:0}
.rback{width:36px;height:36px;border-radius:50%;border:0;background:var(--glass);color:var(--text);font-size:24px;line-height:1;box-shadow:var(--shadow-card);display:grid;place-items:center;padding:0}
.rsp{width:36px}
.seg3 .chip{font-size:13px;white-space:nowrap}
.dflex .donut{width:150px;height:150px}
:root[data-theme="dark"]{--page:#000000;--glass:#111113;--line:#222226;--inp:#0a0a0c;--panel:#111113;--nav:rgba(12,12,14,.85);--hole:#111113;--mut:#8e8e93;--text:#f2f2f7;--seg:rgba(120,120,128,.28)}
:root[data-theme="dark"] .tabs .chip.on{background:#2c2c2e}
:root[data-theme="dark"] .bal{background:linear-gradient(135deg,var(--acc),var(--acc2))!important}
:root[data-theme="dark"] .sgrp,:root[data-theme="dark"] .g{border-color:#222226}
/* ===== v9: dark-mode card separation ===== */
:root[data-theme="dark"]{--glass:#141418;--line:#2c2c33}
:root[data-theme="dark"] .g,:root[data-theme="dark"] .sgrp{border:1px solid #2c2c33!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)!important}
:root[data-theme="dark"] .srow,:root[data-theme="dark"] .row{border-color:#24242b}
/* ===== v10: dark theme elevation - lifted surfaces, visible icons and controls on black ===== */
:root[data-theme="dark"]{--page:#000000;--glass:#1c1c1f;--line:#2c2c31;--inp:#26262b;--panel:#1c1c1f;--nav:rgba(28,28,31,.88);--hole:#1c1c1f;--mut:#9a9aa3;--text:#f5f5f7;--seg:#1c1c1f;--tint-g:rgba(52,211,153,.22);--tint-r:rgba(248,113,113,.22);--tint-p:rgba(167,139,250,.24);--tint-b:rgba(var(--accrgb),.26)}
:root[data-theme="dark"] .g,:root[data-theme="dark"] .sgrp{background:#1c1c1f!important;border:1px solid #2c2c31!important;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 18px rgba(0,0,0,.55)!important}
:root[data-theme="dark"] .st[data-ic]::before{box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
:root[data-theme="dark"] .btn.s,:root[data-theme="dark"] .g>.btn.s{background:#26262b!important;border-color:#2c2c31!important;color:#f5f5f7}
:root[data-theme="dark"] .chip{background:#26262b;border-color:#34343b;color:#e5e5ea}
:root[data-theme="dark"] .tabs{background:#1c1c1f;border:1px solid #2c2c31}
:root[data-theme="dark"] .tabs .chip{background:transparent;border-color:transparent;color:#9a9aa3}
:root[data-theme="dark"] .tabs .chip.on{background:#3a3a40!important;color:#fff!important;box-shadow:0 1px 3px rgba(0,0,0,.5)!important}
:root[data-theme="dark"] .cat,:root[data-theme="dark"] .cty{background:#26262b;border-color:#34343b}
:root[data-theme="dark"] .ic,:root[data-theme="dark"] .wi,:root[data-theme="dark"] .ti{box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
:root[data-theme="dark"] .srow .ico,:root[data-theme="dark"] .sch{color:#7aa2ff}
:root[data-theme="dark"] .nav>div{background:#1c1c1f!important;border:1px solid #2c2c31;box-shadow:0 10px 30px rgba(0,0,0,.6)!important}
:root[data-theme="dark"] .nav button{color:#8e8e96}
:root[data-theme="dark"] .nav button.on{color:#fff}
:root[data-theme="dark"] .bal{box-shadow:0 10px 28px rgba(0,0,0,.5)!important}
:root[data-theme="dark"] input,:root[data-theme="dark"] textarea{background:#26262b;border-color:#34343b;color:#f5f5f7}
:root[data-theme="dark"] .row{border-color:#2c2c31}
:root[data-theme="dark"] .rback{background:#26262b;color:#f5f5f7;box-shadow:0 1px 0 rgba(255,255,255,.06) inset}

/* ===== v11: add-transaction screen as reference ===== */
.seg2{display:flex;gap:10px;margin:4px 0 12px}
.st2{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:17px;font-weight:600;color:var(--mut);font-family:inherit;box-shadow:var(--shadow-card)}
.st2.exp.on{background:#fde7e7;color:#e11d48;border-color:#f8b4b4}
.st2.inc.on{background:#dcfce7;color:#16a34a;border-color:#a7f3d0}
:root[data-theme="dark"] .st2.exp.on{background:rgba(248,113,113,.16);color:#fb7185;border-color:rgba(248,113,113,.35)}
:root[data-theme="dark"] .st2.inc.on{background:rgba(52,211,153,.16);color:#34d399;border-color:rgba(52,211,153,.35)}
.flab{display:block;text-align:center;color:var(--mut);font-size:14px;margin:14px 0 6px}
.fcard{display:flex;align-items:center;gap:12px;width:100%;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-card);font:inherit;color:var(--text);text-align:start;margin:0}
.fcard input{border:0;background:transparent;padding:0;box-shadow:none;font-size:16px;color:var(--text);flex:1;min-width:0}
.fcard input:focus{border:0}
.fcard .fv{flex:1;color:var(--mut);font-size:16px}
.fcard.frow .sch{color:var(--mut)}
.amt{justify-content:space-between}
.amtin{font-size:34px!important;font-weight:800;text-align:end;color:var(--text)!important}
.amt .cur{font-size:18px;font-weight:600;color:var(--mut)}
.ficon2{width:36px;height:36px;border-radius:12px;background:var(--tint-b);display:grid;place-items:center;font-size:17px;flex:none}
.savebtn{margin-top:18px;border-radius:16px;font-size:17px;padding:16px;background:var(--acc)}
.orow{margin-top:0}
.frow:not(.orow) .fv{text-align:start}
/* ===== Font: Ping AR + LT (Arabic + Latin), file in ./fonts/. Falls back to system font if missing ===== */
@font-face{font-family:'PingAR';src:url('fonts/PingAR-Medium.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
body,button,input,select,textarea{font-family:'PingAR',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif!important}
/* ===== v12: bottom dock hides when scrolling down, returns when scrolling up ===== */
.nav{transition:transform .85s cubic-bezier(.25,.8,.25,1)}
.nav.nav-hide{transform:translateY(160%)}
@media (prefers-reduced-motion:reduce){.nav{transition:none}}
html.lite .nav{transition:transform .85s cubic-bezier(.25,.8,.25,1)!important}
/* ===== About sheet ===== */
.appmark{width:68px;height:68px;margin:0 auto;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.appmark .ico{width:34px;height:34px;color:#fff}
.av.mini{width:40px;height:40px;margin:0;display:grid;place-items:center;background:var(--tint-b);color:var(--acc);flex:none;border-radius:50%}
.av.mini .ico{width:20px;height:20px;color:var(--acc)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:14px 0 6px}
.tabs.wide .chip{padding:9px 14px;font-size:14px;line-height:1.2}
.tabs.wide{padding:4px}
/* ===== v18: cleaner + button ===== */
.nav .fab{background:var(--acc)!important;box-shadow:0 6px 16px rgba(var(--accrgb),.32)!important;border:4px solid var(--nav-solid,#fff)}
:root[data-theme="dark"] .nav .fab{--nav-solid:#1c1c1f}
:root[data-theme="light"] .nav .fab{--nav-solid:#ffffff}
.ins{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.ins:last-child{border:0}.ins small{color:var(--mut);font-size:12px}.ins b{font-weight:700}

/* ===== Home redesign (visual only) ===== */
.hero-hi{display:flex;align-items:center;gap:12px;margin:6px 2px 4px}
.hero-hi .hg{flex:1;text-align:start}
.hero-hi .hg b{display:block;font-size:20px;font-weight:800}
.hero-hi .hg small{color:var(--mut);font-size:13px}
.bell{width:42px;height:42px;border-radius:50%;border:0;background:var(--glass);box-shadow:var(--shadow-card);font-size:18px;flex:none}
.hdate{margin:0 4px 12px}.hdate small{color:var(--mut);font-size:13px}
.bal{background:linear-gradient(135deg,#5b8cff,#8f6bff)!important;border-radius:26px!important;padding:20px 20px 18px!important;position:relative;overflow:hidden}
.bal::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:90px;background:radial-gradient(60% 100% at 50% 100%,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 16px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text);font:inherit;font-size:13px;font-weight:600;padding:0}
.qa i{font-style:normal;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--glass);box-shadow:var(--shadow-card);color:var(--acc)}
.qa button:first-child i{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.grid3 .st[data-ic="inc"],.grid3 .st[data-ic="exp"],.grid3 .st[data-ic="loan"]{border-radius:22px}
.grid3 .st[data-ic="inc"]{background:linear-gradient(160deg,#e9fdf4,#f7fffb)}
.grid3 .st[data-ic="exp"]{background:linear-gradient(160deg,#fff0f3,#fff8fa)}
.grid3 .st[data-ic="loan"]{background:linear-gradient(160deg,#f3eeff,#fbf9ff)}
:root[data-theme="dark"] .grid3 .st[data-ic]{background:var(--glass)!important}
.qa2{grid-template-columns:repeat(2,minmax(0,140px));justify-content:center;column-gap:36px}

/* ===== v3 home: single savings blob, bell badge ===== */
.qa1{grid-template-columns:1fr;justify-items:center;margin:14px 0 18px}
.qa1 button{width:auto}
.qa1 i.blob{width:96px;height:96px;border-radius:52% 48% 60% 40% / 45% 55% 45% 55%;background:linear-gradient(135deg,#ffd6e8,#d9c8ff 55%,#bfe3ff);box-shadow:0 10px 26px rgba(120,90,255,.22);font-size:34px;color:inherit;position:relative}
.qa1 i.blob::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px dashed rgba(120,90,255,.25);animation:none}
.bell{position:relative}
.bdg{position:absolute;top:-3px;inset-inline-end:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;line-height:18px;display:none}

/* ===== v4 home: full-width savings row ===== */
.sv-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 18px;border:0;border-radius:20px;background:var(--glass);box-shadow:var(--shadow-card);font:inherit;font-size:17px;font-weight:700;color:var(--text);margin:0 0 12px;cursor:pointer;text-align:start}
.sv-row .sch{color:var(--mut);font-size:24px;line-height:1;font-style:normal}
.sv-row:active{transform:scale(.99)}


</style>

function dragTo(cx){
  const d=document.querySelector('.nav>div'),dr=d.querySelector('.drop'),T=tabs();if(!T.length)return;
  const q=d.getBoundingClientRect(),r0=T[0].getBoundingClientRect(),w=Math.max(...T.map(b=>b.getBoundingClientRect().width));
  dr.style.opacity=1;dr.style.width=w+'px';dr.style.height=r0.height+'px';dr.style.top=(r0.top-q.top)+'px';
  dr.style.left=Math.max(4,Math.min(q.width-w-4,cx-q.left-w/2))+'px';
  let best=0,bd=1e9;T.forEach((b,i)=>{const r=b.getBoundingClientRect(),dd=Math.abs(r.left+r.width/2-cx);if(dd<bd){bd=dd;best=i}});
  T.forEach(b=>{const r=b.getBoundingClientRect(),k=Math.max(0,1-Math.abs(r.left+r.width/2-cx)/(w*1.25));b.style.setProperty('--z',(1+0.5*Math.pow(k,1.5)).toFixed(3))});
  if(nd&&nd.idx!==best){nd.idx=best;T.forEach((b,i)=>b.classList.toggle('pv',i===best));try{navigator.vibrate&&navigator.vibrate(4)}catch(_){}}
}

const QK=[['income','مرتب',/مرتب|راتب|قبضت|salary|income/],['expense','أكل',/اكل|أكل|غدا|غداء|عشا|عشاء|فطار|قهوة|قهوه|مطعم|بيتزا|ساندوتش|food|lunch|dinner|breakfast|coffee|restaurant/],['expense','مواصلات',/مواصلات|تاكسي|اوبر|أوبر|بنزين|مترو|اتوبيس|أتوبيس|ميكروباص|taxi|uber|fuel|gas|bus|metro/],['expense','فواتير',/فاتورة|فواتير|كهرباء|مياه|غاز|انترنت|إنترنت|ايجار|إيجار|تليفون|bill|electric|internet|rent|phone/],['expense','تسوق',/تسوق|هدوم|ملابس|سوبر|shopping|clothes|market/],['expense','صحة',/دواء|دكتور|صيدلية|علاج|health|doctor|pharmacy|medicine/],['expense','ترفيه',/سينما|خروجة|لعبة|نتفلكس|ترفيه|cinema|movie|game|netflix/],['expense','تعليم',/كورس|كتاب|مدرسة|جامعة|دروس|course|book|school|class/]];
function qkParse(t){
  t=String(t||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/,/g,'').replace('٫','.');
  const m=t.match(/\d+(\.\d+)?/);if(!m)return null;const amt=parseFloat(m[0]);if(!(amt>0))return null;
  const note=t.replace(m[0],'').trim(),lw=note.toLowerCase();let type='expense',cat='أخرى';
  for(const k of QK)if(k[2].test(lw)){type=k[0];cat=k[1];break}
  return{type,cat,amt,note};
}

/* Save a file on any platform. Inside the Android app: write to app cache, then open the system share sheet (Save to Files / Drive / WhatsApp...). No storage permission needed. In a browser: normal download. */
async function saveFile(name,mime,text){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    try{
      const FS=C.Plugins.Filesystem;
      const data=btoa(unescape(encodeURIComponent(text)));
      const w=await FS.writeFile({path:name,data,directory:'CACHE',recursive:true});
      await C.Plugins.Share.share({title:name,files:[w.uri]});
      return;
    }catch(e){toast('تعذّر حفظ الملف');return}
  }
  try{
    const file=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
}

function niceTop(v){const p=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)))),u=p/2;return Math.max(u,Math.ceil(v/u)*u)}
function dailyBars(R,L){
  const exp=L.filter(t=>t.type==='expense'),dn=x=>{const [y,m,d]=x.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5},base=dn(iso(R.s));
  let B;
  if(rmode==='y'){B=MN.map((m,i)=>({lab:String(i+1),v:0}));exp.forEach(t=>{B[+t.date.slice(5,7)-1].v+=t.amt})}
  else if(rmode==='q'){const n=Math.ceil((dn(iso(R.e))-base+1)/7);B=Array.from({length:n},(_,i)=>({lab:String(i+1),v:0}));exp.forEach(t=>{const k=Math.floor((dn(t.date)-base)/7);if(k>=0&&k<n)B[k].v+=t.amt})}
  else{const n=Math.round(dn(iso(R.e))-base)+1;B=Array.from({length:n},(_,i)=>({lab:String(i+1),v:0}));exp.forEach(t=>{const k=Math.round(dn(t.date)-base);if(k>=0&&k<n)B[k].v+=t.amt})}
  const mx=Math.max(1,...B.map(b=>b.v)),top=niceTop(mx);
  const ticks=[top,top*2/3,top/3,0].map(v=>f(Math.round(v)));
  const n=B.length;
  return `<div class="dbar"><div class="yax">${ticks.map(v=>`<span>${v}</span>`).join('')}</div><div class="dcols">${B.map((b,i)=>`<div class="dc"><i style="height:${b.v/top*100}%"></i><small>${(n<=12||i===0||(i+1)%5===0||i===n-1)?b.lab:''}</small></div>`).join('')}</div></div>`;
}

  const grad=ent.length?ent.map(([c,v])=>{const a=acc/s.expense*360;acc+=v;return `${COL[c]||'#94a3b8'} ${a}deg ${acc/s.expense*360}deg`}).join(','):'rgba(255,255,255,.1) 0 360deg';

  const cards=S.wallets.map(w=>{const v=wBal(w);return `<div class="g wcard"><div class="wi">${w.ico||'👛'}</div><div class="wm" onclick="openWalEdit('${w.id}')" style="cursor:pointer"><small>${wn(w)}</small><b class="${v<0?'exp':''}">${f(v)} ${CUR()}</b></div>${S.wallets.length>1?`<button class="del" onclick="delWallet('${w.id}')">🗑</button>`:''}</div>`}).join('');
  $('#s-wal').innerHTML=`<h2>المحافظ</h2>
  <div class="g wtot"><small>إجمالي المحافظ</small><b>${f(tot)} ${CUR()}</b></div>
  <button class="btn" style="margin:0 0 14px;width:100%" onclick="openTransfer()">تحويل بين المحافظ</button>
  <div class="sec">محافظك</div>${cards||'<div class="g empty">ضيف محفظتك من تحت: كاش أو فيزا أو محفظة أو انستاباي</div>'}
  <div class="g"><div class="sec" style="margin-top:0">محفظة جديدة</div><div class="tabs wide" style="margin:0 0 10px"><button class="chip" onclick="walQuick('Cash','💵')">${WL('cash')}</button><button class="chip" onclick="walQuick('Visa','💳')">${WL('visa')}</button><button class="chip" onclick="walQuick('Wallet','📱')">${WL('wallet')}</button><button class="chip" onclick="walQuick('InstaPay','🏦')">${WL('insta')}</button></div><div class="row" style="border:0;padding:0"><input id="wal-name" placeholder="محفظة أخرى (اختياري)"><button class="btn" style="width:auto;margin:0;padding:12px 16px" onclick="walAdd()">إضافة</button></div></div>`;
}
function walQuick(n,i){if(S.wallets.some(w=>(WK[w.name]||w.name)===(WK[n]||n))){toast('المحفظة دي موجودة');return}S.wallets.push({id:'w'+Date.now(),name:n,ico:i,open:0});save();render()}

function openWalEdit(id){
  const w=S.wallets.find(x=>x.id===id);if(!w)return;
  openPick('الرصيد الفعلي',`<div class="g"><small style="color:var(--mut)">${wn(w)}</small><input id="we-bal" type="number" inputmode="decimal" value="${wBal(w)}" style="margin-top:8px"><button class="btn" style="margin-top:12px;width:100%" onclick="saveWalBal('${id}')">حفظ</button></div>`);
}
function saveWalBal(id){
  const w=S.wallets.find(x=>x.id===id);const target=parseFloat($('#we-bal').value);
  if(!w||isNaN(target)){toast('اكتب الرصيد');return}
  w.open=(w.open||0)+(target-wBal(w));save();closeSheet();render();
}
function openTransfer(){
  if(S.wallets.length<2){toast('لازم تكون عندك محفظتين على الأقل');return}
  const opts=S.wallets.map((w,i)=>`<option value="${w.id}" ${i===1?'selected':''}>${w.ico} ${wn(w)}</option>`).join('');
  const opts0=S.wallets.map((w,i)=>`<option value="${w.id}" ${i===0?'selected':''}>${w.ico} ${wn(w)}</option>`).join('');
  openPick('تحويل بين المحافظ',`<div class="g"><label class="flab">من</label><select id="tr-from">${opts0}</select><label class="flab">إلى</label><select id="tr-to">${opts}</select><label class="flab">المبلغ</label><input id="tr-amt" type="number" inputmode="decimal" placeholder="0"><label class="flab">التاريخ</label><input id="tr-date" type="date" value="${iso(new Date())}"><button class="btn" style="margin-top:12px;width:100%" onclick="saveTransfer()">تحويل</button></div>`);
}
function saveTransfer(){
  const a=$('#tr-from').value,b=$('#tr-to').value,amt=parseFloat($('#tr-amt').value);
  if(!(amt>0)){toast('اكتب المبلغ');return}
  if(a===b){toast('اختار محفظتين مختلفتين');return}
  S.tx.push({id:Date.now()+'',type:'transfer',cat:'',amt,note:'',date:$('#tr-date').value||iso(new Date()),due:'',t:Date.now(),w:a,w2:b});
  save();closeSheet();render();toast('تم التحويل');
}
function walAdd(){const n=$('#wal-name').value.trim();if(!n){toast('اكتب اسم المحفظة');return}S.wallets.push({id:'w'+Date.now(),name:n,ico:'👛',open:0});save();render()}
const R={home,add:addScr,log,rep,set:setScr,plan:planScr,wal:walScr};let cur='home';
function render(){R[cur]();if(cur==='home'){const e=$('#heroN');if(e)countUp(e,+e.dataset.v)}}
function go(n){cur=n;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+n));
  document.querySelectorAll('.nav button[data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===n));
  if(n==='add'){add={type:'expense',cat:'أكل',w:S.lastW,split:false}}if(n==='rep')off=0;const sc=$('#s-'+n);sc.classList.remove('enter');void sc.offsetWidth;sc.classList.add('enter');setTimeout(()=>sc.classList.remove('enter'),800);render();updBadge();window.scrollTo(0,0);moveDrop(true)}

let salRows=[];
const salDue=()=>{const n=new Date();return Math.min(S.sal.day,new Date(n.getFullYear(),n.getMonth()+1,0).getDate())};
function salCheck(){const Z=S.sal,n=new Date(),td=iso(n);
  if(!Z||!Z.on||!(Z.amt>0)||Z.done===td.slice(0,7)||Z.snooze===td||n.getDate()<salDue())return false;
  salAsk();return true}
function salAsk(){const Z=S.sal;sheet(`<div class="avatar">💰</div><h3>المرتب نزل؟</h3><p style="text-align:center">${f(Z.amt)} ${CUR()}</p><button class="btn" onclick="salYes()">✅ أيوه، نزل</button><button class="btn s" onclick="salLater()">⏳ لسه</button><button class="btn s" onclick="salSkip()">تخطي الشهر ده</button>`)}
function salLater(){S.sal.snooze=iso(new Date());save();closeSheet();toast('تمام، هسألك تاني بكرة')}
function salSkip(){S.sal.done=iso(new Date()).slice(0,7);save();closeSheet();remSync()}
function salYes(){const Z=S.sal,have=new Set(S.wallets.map(w=>WK[w.name]||w.id));
  salRows=S.wallets.map(w=>({key:WK[w.name]||w.id,id:w.id,name:w.name,ico:w.ico||'👛'}));
  [['cash','Cash','💵'],['visa','Visa','💳'],['wallet','Wallet','📱']].forEach(([k,n,i])=>{if(!have.has(k))salRows.push({key:k,id:'',name:n,ico:i,nw:1})});
  const sp=Z.split||{},has=Object.keys(sp).some(k=>salRows.some(r=>r.key===k));
  sheet(`<h3>المرتب ماشي معاك ازاي؟</h3><p style="text-align:center">وزّع المرتب على كاش وفيزا ومحافظك</p><label class="flab">المبلغ اللي نزل</label><div class="fcard amt"><input id="sal-tot" type="number" inputmode="decimal" class="amtin" value="${Z.amt}" oninput="salSum()"><span class="cur">${CUR()}</span></div><div style="margin-top:10px">${salRows.map((r,i)=>`<div class="fcard frow" style="margin-bottom:8px"><span class="ficon2">${r.ico}</span><span class="fv">${U(wLab(r))}</span><input class="wsp" data-i="${i}" type="number" inputmode="decimal" placeholder="0" value="${has?(sp[r.key]?Math.round(Z.amt*sp[r.key]):''):(i===0?Z.amt:'')}" oninput="salSum()"></div>`).join('')}</div><div id="salS" class="sec" style="text-align:center"></div><button class="btn" onclick="salSave()">سجّل المرتب</button>`);salSum()}
const salVals=()=>salRows.map((r,i)=>parseFloat(document.querySelector(`.wsp[data-i="${i}"]`).value)||0);
function salSum(){const t=salVals().reduce((a,b)=>a+b,0),T=parseFloat($('#sal-tot').value)||0,d=T-t,e=$('#salS');if(e)e.textContent=tr('الموزّع')+': '+f(t)+' / '+f(T)+(d>0.5?'  •  '+tr('باقي')+' '+f(d):d<-0.5?'  •  '+tr('فوق المتوقع')+' '+f(-d):' ✓')}
function salSave(){const v=salVals(),tot=v.reduce((a,b)=>a+b,0);if(!(tot>0)){toast('اكتب المبلغ');return}
  const now=Date.now(),td=iso(new Date()),sp={};
  if(!S.wallets.length)salRows.forEach((r,i)=>{r.id='w'+now+i;S.wallets.push({id:r.id,name:r.name,ico:r.ico,open:0});r.nw=0});
  salRows.forEach((r,i)=>{if(!(v[i]>0))return;if(r.nw){r.id='w'+now+i;S.wallets.push({id:r.id,name:r.name,ico:r.ico,open:0})}
    S.tx.push({id:now+'_s'+i,type:'income',cat:'مرتب',amt:v[i],note:'',w:r.id,date:td,due:'',t:now+i});sp[r.key]=v[i]/tot;S.lastW=r.id});
  S.sal.split=sp;S.sal.done=td.slice(0,7);save();closeSheet();go('home');toast('تم تسجيل المرتب ✅')}
function salHTML(){const Z=S.sal;return `<div class="g"><div class="tabs" style="margin:0 0 8px"><button class="chip ${Z.on?'on':''}" onclick="salTog()">${Z.on?'تذكير المرتب شغّال ✓':'تفعيل تذكير المرتب'}</button></div><label>يوم نزول المرتب (1-31)</label><input id="sl-d" type="number" inputmode="numeric" value="${Z.day||''}" placeholder="5"><label>مبلغ المرتب</label><input id="sl-a" type="number" inputmode="decimal" value="${Z.amt||''}" placeholder="5000"><button class="btn" onclick="salCfg()">حفظ</button></div>`}
function salTog(){if(S.sal.on){S.sal.on=false;save();remSync();setScr()}else salCfg()}
function salCfg(){const d=parseInt($('#sl-d')?$('#sl-d').value:S.sal.day),a=parseFloat($('#sl-a')?$('#sl-a').value:S.sal.amt);
  if(!(a>0)||!(d>=1&&d<=31)){toast('اكتب يوم ومبلغ صح');return}
  S.sal.day=d;S.sal.amt=a;S.sal.on=true;S.sal.snooze='';save();remSync();setScr();closeSheet();render();toast('تم حفظ إعدادات المرتب')}

let lockedNow=false,authBusy=false;
const bioNative=()=>{const P=window.Capacitor&&Capacitor.Plugins;return P?(P.BiometricAuth?'ba':P.NativeBiometric?'nb':''):''};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function bioSupported(){if(bioNative())return true;try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function bioAuth(setup){authBusy=true;
  try{const P=window.Capacitor&&Capacitor.Plugins,n=bioNative(),why=tr('تأكيد هويتك');
    if(n==='ba'){await P.BiometricAuth.authenticate({reason:why,allowDeviceCredential:true,cancelTitle:tr('إلغاء'),androidTitle:why});return true}
    if(n==='nb'){await P.NativeBiometric.verifyIdentity({reason:why,title:why,useFallback:true});return true}
    const ch=crypto.getRandomValues(new Uint8Array(32));
    if(setup||!S.cred){const c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:APP_NAME},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'my-cash-tracker',displayName:APP_NAME},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});S.cred=b64(c.rawId);save(false);return true}
    await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:'public-key',id:unb64(S.cred)}],userVerification:'required',timeout:60000}});return true
  }catch(e){return false}finally{setTimeout(()=>authBusy=false,700)}}
function lockDraw(msg){$('#lock').innerHTML=`<div style="max-width:360px;margin:16vh auto 0;text-align:center"><div style="font-size:56px">🔒</div><h2>${APP_NAME}</h2><p style="color:var(--mut)">${tr(msg||'التطبيق مقفول')}</p><button class="btn" onclick="lockTry()">🔓 ${tr('افتح')}</button></div>`;$('#lock').classList.add('on')}
async function lockTry(){if(authBusy)return;const ok=await bioAuth();if(ok)closeLock();else lockDraw('التأكيد فشل، حاول تاني')}

<script>
(function(){
  let lastY=window.scrollY||0,ticking=false;
  const nav=document.querySelector('.nav');
  function update(){
    const y=Math.max(0,window.scrollY||document.documentElement.scrollTop||0);
    const d=y-lastY;
    if(y<=24)nav.classList.remove('nav-hide');
    else if(d>6)nav.classList.add('nav-hide');
    else if(d<-6)nav.classList.remove('nav-hide');
    if(Math.abs(d)>6)lastY=y;
    ticking=false;
  }
  window.addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(update)}},{passive:true});
})();
</script>
<script>
/* Native behaviour (only runs inside the Capacitor Android app; plain browser ignores it):
   - Android back button closes open sheets first, then goes to Home, then exits the app.
   - Status bar matches the theme. */
(function(){
  const C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform()||!C.Plugins)return;
  const P=C.Plugins;
  if(P.App){
    P.App.addListener('backButton',()=>{
      if($('#sheet').classList.contains('on')){closeSheet();return}
      if(cur!=='home'){go('home');return}
      P.App.exitApp();
    });
  }
  if(P.StatusBar){
    const dark=()=>document.documentElement.dataset.theme==='dark'||(document.documentElement.dataset.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
    const apply=()=>{try{P.StatusBar.setStyle({style:dark()?'DARK':'LIGHT'});P.StatusBar.setBackgroundColor({color:dark()?'#000000':'#f2f5fb'})}catch(e){}};
    apply();
    new MutationObserver(apply).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  }
})();
</script>
<script>
/* Swipe from the left or right screen edge = Back (closes sheet, then goes Home). */
(function(){
  let sx=0,sy=0,edge=null,t0=0;
  const W=()=>window.innerWidth;
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;t0=Date.now();
    edge=(sx<22)?'L':(sx>W()-22)?'R':null;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!edge)return;
    const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dy)>60||Math.abs(dx)<90||Date.now()-t0>700){edge=null;return}
    edge=null;
    if($('#sheet').classList.contains('on')){closeSheet();return}
    if(cur!=='home')go('home');
  },{passive:true});
})();
</script>
